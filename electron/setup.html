<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Context Fence — First run setup</title>
  <style>
    :root {
      --bg: #0f0f14;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --muted: #8e8e99;
      --teal: #00a699;
      --amber: #f4b942;
      --coral: #ff5a5f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, rgba(0, 166, 153, 0.10), transparent 60%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      -webkit-user-select: none; user-select: none;
    }
    .head { padding: 34px 40px 8px; }
    .head h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .head p { color: var(--muted); font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
    .card {
      margin: 18px 40px 0; padding: 20px 22px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; backdrop-filter: blur(20px);
      flex: 1;
    }
    .step { display: flex; gap: 14px; padding: 10px 0; align-items: flex-start; }
    .step-icon {
      width: 26px; height: 26px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      border: 1px solid var(--border); color: var(--muted);
    }
    .step-icon.running { border-color: var(--teal); animation: spin 1s linear infinite; }
    .step-icon.running::after {
      content: ''; width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--teal); border-top-color: transparent;
    }
    .step-icon:has(~ div) { color: var(--teal); border-color: var(--teal); }
    .step-title { font-size: 13.5px; font-weight: 600; }
    .step-detail { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; word-break: break-all; }
    .foot { padding: 18px 40px 34px; }
    #barwrap {
      height: 6px; border-radius: 3px; overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
    }
    #bar { width: 0; height: 100%; background: linear-gradient(90deg, var(--teal), #2dd4bf); transition: width 320ms ease; }
    #bar.done { width: 100% !important; background: linear-gradient(90deg, var(--teal), #2dd4bf); }
    #status { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="head">
    <h1>Context Fence</h1>
    <p>First run — setting up your local MCP firewall. This happens once and needs no terminal.</p>
  </div>
  <div class="card">
    <ul id="steps" style="list-style:none"></ul>
  </div>
  <div class="foot">
    <div id="barwrap"><div id="bar"></div></div>
    <div id="status"></div>
  </div>
  <script src="setup.js"></script>
</body>
</html>
